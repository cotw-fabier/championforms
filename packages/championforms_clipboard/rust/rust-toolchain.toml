[toolchain]
# native_toolchain_rust requires an exact version (not "stable") and checks
# that every triple it builds is listed below.
channel = "1.97.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  # The iOS simulator build compiles both of these.
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
