name: championforms_clipboard
description: "Multi-format system clipboard for Flutter (plain text, HTML, images, files and custom types) on every platform, backed by Rust native assets, JNI on Android and the web Clipboard API."
version: 0.1.0-dev.2
homepage: "https://championsoftheweb.com"
repository: "https://github.com/cotw-fabier/championforms/tree/main/packages/championforms_clipboard"
issue_tracker: "https://github.com/cotw-fabier/championforms/issues"

topics:
  - clipboard
  - copy-paste
  - native-assets

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

# Member of the repository-root pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  web: ^1.1.1
  jni: ^1.0.3
  jni_flutter: ^1.0.3
  # Native-assets build hook (hook/build.dart builds the Rust crate). These
  # are regular dependencies because the hook runs in consumers' builds.
  hooks: ^2.2.0
  code_assets: ^2.1.0
  native_toolchain_rust: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Android only: the plugin module merges the ContentProvider that serves
  # copied images and files (android/src/main/AndroidManifest.xml). Every
  # other platform is FFI or package:web and needs no plugin registration.
  plugin:
    platforms:
      android:
        package: com.championforms.clipboard
        pluginClass: ChampionformsClipboardPlugin
