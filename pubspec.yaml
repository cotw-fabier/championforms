name: championforms
description: "Easy Build Data Input Fields of All Types in Flutter with clean, modern API using idiomatic Dart namespace patterns"
version: 0.8.0-dev.1
homepage: "https://championsoftheweb.com"
repository: "https://github.com/cotw-fabier/championforms/"
issue_tracker: "https://github.com/cotw-fabier/championforms/issues"
documentation: "https://github.com/cotw-fabier/championforms/#readme"

# Surfaced on pub.dev search. Deliberately includes `json` and `dynamic-forms`
# as of 0.7.0 — a form can now be stored and rendered as data, and that is what
# somebody looking for this package would search for.
topics:
  - forms
  - form-builder
  - validation
  - json
  - ui

environment:
  # Floor set by the dependencies: file_picker 13, image_picker 1.2.3 and
  # cross_file 0.3.5+5 all require Dart 3.10 / Flutter 3.38.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

# Pub workspace (monorepo). The championforms package itself stays at the
# repository root, so existing `path:` and `git:` consumers keep working. The
# members below share this root's single pubspec.lock. `.pubignore` keeps
# `packages/` out of the published championforms archive.
workspace:
  - example
  - packages/championforms_clipboard
  - packages/championforms_clipboard/example
  - packages/championforms_documents
  - packages/championforms_documents/example

dependencies:
  flutter:
    sdk: flutter
  email_validator: ^3.0.0
  collection: ^1.19.0
  uuid: ^4.6.0
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  cross_file: ^0.3.5+5
  mime: ^2.1.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

